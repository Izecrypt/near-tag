name: Worker checks

on:
  pull_request:
    branches: [master]
  push:
    branches: ["worker/**"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r attestor/requirements.txt
      - run: python -m unittest discover -s attestor -p 'test_*.py'
      - run: python -m unittest discover -s sim -p 'test_*.py'

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path contract/Cargo.toml

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --manifest-path contract/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: tag-mechanics-wasm-${{ github.sha }}
          path: contract/target/wasm32-unknown-unknown/release/tag_mechanics.wasm
          if-no-files-found: error
          retention-days: 3
